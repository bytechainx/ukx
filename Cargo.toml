[package]
name = "ukx"
version = "0.1.1"
edition = "2021"
rust-version = "1.71"
description = "英国央行（BoE）数据源事实层：源登记与 IADB 关键码类型化、离线解析、曲线路由与 fail-closed 授权判定"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/ukx"
homepage = "https://github.com/bytechainx/ukx"
documentation = "https://github.com/bytechainx/ukx#readme"
readme = "README.md"
keywords = ["boe", "uk", "macro", "offline-parse", "source-facts"]
categories = ["data-structures", "parsing"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "LICENSE-*",
    "Cargo.toml",
]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
